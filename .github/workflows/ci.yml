name: PIA Hotel Costa Azul - quality and Docker
'on':
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Automated tests (80% minimum)
        env:
          ENABLE_SCHEDULER: 'false'
          DATABASE_PATH: /tmp/hotel_ci.db
        run: python -m pytest -q --cov=src --cov-report=term-missing --cov-fail-under=80
      - name: OpenAPI is synchronized
        env:
          DATABASE_PATH: /tmp/hotel_schema.db
        run: |
          python scripts/export_openapi.py
          git diff --exit-code -- docs/api/openapi.yaml
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare disposable CI variables
        run: |
          echo 'POSTGRES_USER=hotel' > .env
          echo 'POSTGRES_PASSWORD=ci_database_only_password' >> .env
          echo 'POSTGRES_DB=hotel' >> .env
      - name: Start DB and App
        run: docker compose up -d --build db app
      - name: Swagger /health smoke test
        run: |
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/health && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/openapi.json > /tmp/openapi.json
      - name: Run DB + App + Tests
        run: docker compose --profile test run --rm tests
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop
        if: always()
        run: docker compose down -v
