services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hotel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:-hotel}
    volumes:
      - hotel_pgdata:/var/lib/postgresql/data
      - ./docker/create-test-db.sql:/docker-entrypoint-initdb.d/create-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hotel} -d ${POSTGRES_DB:-hotel}"]
      interval: 5s
      timeout: 3s
      retries: 20
  app:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-hotel}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-hotel}
      ADMIN_PIN_HASH: ${ADMIN_PIN_HASH:-}
      ROLE_TOKEN_ADMIN: ${ROLE_TOKEN_ADMIN:-}
      ROLE_TOKEN_MAINTENANCE: ${ROLE_TOKEN_MAINTENANCE:-}
      HOLY_WEEK_RANGES: ${HOLY_WEEK_RANGES:-}
      ENABLE_SCHEDULER: "true"
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  tests:
    profiles: ["test"]
    build: .
    command: ["python", "-m", "pytest", "-q", "--cov=src", "--cov-report=term-missing", "--cov-fail-under=80"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-hotel}:${POSTGRES_PASSWORD}@db:5432/hotel_test
      POSTGRES_TEST_URL: postgresql+psycopg://${POSTGRES_USER:-hotel}:${POSTGRES_PASSWORD}@db:5432/hotel_test
      ENABLE_SCHEDULER: "false"
    depends_on:
      db:
        condition: service_healthy
volumes:
  hotel_pgdata:
