components:
  schemas:
    ActorInput:
      properties:
        actor_role:
          type: string
          title: Actor Role
      type: object
      required:
      - actor_role
      title: ActorInput
    AdjustmentInput:
      properties:
        action:
          type: string
          title: Action
          description: descuento, condonación, anulación
        value:
          anyOf:
          - type: number
            exclusiveMinimum: 0.0
          - type: string
          title: Value
          description: Porcentaje para descuento, monto MXN para condonación y anulación
        admin_pin:
          anyOf:
          - type: string
          - type: 'null'
          title: Admin Pin
      type: object
      required:
      - action
      - value
      title: AdjustmentInput
    CancelInput:
      properties:
        waive_penalty:
          type: boolean
          title: Waive Penalty
          default: false
        admin_pin:
          anyOf:
          - type: string
          - type: 'null'
          title: Admin Pin
      type: object
      title: CancelInput
    ChangeRoomInput:
      properties:
        new_room_number:
          type: string
          title: New Room Number
        reason:
          type: string
          title: Reason
          description: avería o upgrade
      type: object
      required:
      - new_room_number
      - reason
      title: ChangeRoomInput
    CheckInInput:
      properties:
        document_type:
          type: string
          title: Document Type
          description: Solo INE o Pasaporte; NO enviar número ni imagen del documento
        companions:
          items:
            type: string
          type: array
          title: Companions
        incidental_type:
          type: string
          title: Incidental Type
          description: voucher (1000 MXN) o efectivo (500 MXN); sin datos de tarjeta
      type: object
      required:
      - document_type
      - incidental_type
      title: CheckInInput
    ConfirmInput:
      properties:
        deposit:
          anyOf:
          - type: number
            minimum: 0.0
          - type: string
          - type: 'null'
          title: Deposit
        card_guarantee:
          type: boolean
          title: Card Guarantee
          default: false
      type: object
      title: ConfirmInput
    ConsumptionInput:
      properties:
        category:
          type: string
          title: Category
        description:
          type: string
          minLength: 1
          title: Description
        amount:
          anyOf:
          - type: number
            exclusiveMinimum: 0.0
          - type: string
          title: Amount
        signature:
          type: string
          minLength: 1
          title: Signature
          description: Evidencia de firma; demostración, NO una firma real
        room_number:
          type: string
          title: Room Number
      type: object
      required:
      - category
      - description
      - amount
      - signature
      - room_number
      title: ConsumptionInput
    EarlyDepartureInput:
      properties:
        notice_at:
          type: string
          format: date-time
          title: Notice At
        departure_at:
          type: string
          format: date-time
          title: Departure At
      type: object
      required:
      - notice_at
      - departure_at
      title: EarlyDepartureInput
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    JobInput:
      properties:
        admin_pin:
          type: string
          title: Admin Pin
      type: object
      required:
      - admin_pin
      title: JobInput
    MaintenanceInput:
      properties:
        reason:
          type: string
          minLength: 2
          title: Reason
        reactivation:
          type: string
          format: date
          title: Reactivation
        actor_role:
          type: string
          title: Actor Role
      type: object
      required:
      - reason
      - reactivation
      - actor_role
      title: MaintenanceInput
    PaymentInput:
      properties:
        amount:
          anyOf:
          - type: number
            exclusiveMinimum: 0.0
          - type: string
          title: Amount
        method:
          type: string
          title: Method
      type: object
      required:
      - amount
      - method
      title: PaymentInput
    ReservationInput:
      properties:
        guest_name:
          type: string
          maxLength: 160
          minLength: 2
          title: Guest Name
        check_in:
          type: string
          format: date
          title: Check In
        check_out:
          type: string
          format: date
          title: Check Out
        room_type:
          $ref: '#/components/schemas/RoomType'
        guests:
          type: integer
          maximum: 4.0
          minimum: 1.0
          title: Guests
      type: object
      required:
      - guest_name
      - check_in
      - check_out
      - room_type
      - guests
      title: ReservationInput
    RoomType:
      type: string
      enum:
      - Estándar
      - Doble
      - Suite
      title: RoomType
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
