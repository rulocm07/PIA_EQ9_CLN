  /rooms/{room_number}/out-of-service:
    post:
      tags:
      - Habitaciones
      summary: Block
      operationId: block_rooms__room_number__out_of_service_post
      parameters:
      - name: room_number
        in: path
        required: true
        schema:
          type: string
          title: Room Number
      - name: x-role-token
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Role-Token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaintenanceInput'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /rooms/{room_number}/reactivate:
