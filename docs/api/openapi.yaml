          application/json:
            schema:
              $ref: '#/components/schemas/ConsumptionInput'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /folios/{folio_id}/payments:
    post:
      tags:
