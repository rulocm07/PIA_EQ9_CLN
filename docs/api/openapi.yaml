openapi: 3.1.0
info:
  title: Hotel Costa Azul API
  description: PIA académico BR-01..BR-20. Pagos y cargos a tarjetas simulados; roles declarativos para la demo.
    No introducir documentos reales.
  version: 2.0.0
paths:
  /health:
    get:
      tags:
      - Sistema
      summary: Health
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /rooms:
    get:
      tags:
      - Habitaciones
      summary: Rooms
      operationId: rooms_rooms_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /availability:
    get:
      tags:
      - Reservaciones
      summary: Availability
      operationId: availability_availability_get
      parameters:
      - name: check_in
        in: query
        required: true
        schema:
          type: string
          format: date
          title: Check In
      - name: check_out
        in: query
        required: true
        schema:
          type: string
          format: date
          title: Check Out
      - name: room_type
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/RoomType'
      - name: guests
        in: query
        required: true
        schema:
          type: integer
          title: Guests
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /pricing/quote:
