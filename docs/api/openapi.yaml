      summary: Clean
      operationId: clean_rooms__room_number__clean_post
      parameters:
      - name: room_number
        in: path
        required: true
        schema:
          type: string
          title: Room Number
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
